<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My AWS EC2 Server</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 90%;
            max-width: 650px;

            padding: 50px 30px;

            text-align: center;

            background: #1e293b;

            border-radius: 20px;

            box-shadow:
                0 20px 50px rgba(0,0,0,0.4);
        }

        .cloud {
            font-size: 70px;
        }

        h1 {
            font-size: 42px;
            margin: 15px 0;
        }

        p {
            color: #cbd5e1;
            font-size: 18px;
            line-height: 1.6;
        }

        .status {
            display: inline-block;

            margin-top: 20px;

            padding: 12px 22px;

            border-radius: 50px;

            background: #16a34a;

            font-weight: bold;
        }

        .info {
            margin-top: 30px;

            padding: 20px;

            background: #0f172a;

            border-radius: 12px;

            text-align: left;
        }

        .info div {
            margin: 10px 0;
        }

        .label {
            color: #94a3b8;
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="cloud">
            ☁️
        </div>

        <h1>
            My AWS Server
        </h1>

        <p>
            Welcome to my first application running
            on Amazon EC2.
        </p>

        <div class="status">
            🟢 SERVER ONLINE
        </div>

        <div class="info">

            <div>
                <span class="label">Cloud:</span>
                AWS
            </div>

            <div>
                <span class="label">Service:</span>
                Amazon EC2
            </div>

            <div>
                <span class="label">Web Server:</span>
                Nginx
            </div>

            <div>
                <span class="label">Developer:</span>
                Fundani Zondo
            </div>

        </div>

    </div>

</body>
</html>
